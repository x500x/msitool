; msitool pack manifest (UTF-8). Pass with: msitool pack <dir> <out.msi> --config pack.ini
; Semicolons / '#' at the start of a line are comments. Values are trimmed.
; Relative paths are resolved against the input directory.

[pack]
; Split the payload into ~16 MiB cabinets (0 / omitted = one CAB).
cab-size = 16
; none | basic | minimal (adds a compact welcome/progress/exit wizard).
ui = minimal
; layout (default) | error  -- behaviour for files larger than 2 GiB.
large-files = layout

[feature:Core]
title = Core files
description = The application binaries
dirs = bin
level = 1
display = 2

[feature:Extras]
title = Extras
description = Documentation and samples
dirs = docs; samples
level = 1

[shortcut:StartMenu]
name = My App.lnk
dir = ProgramMenuFolder
target = bin\app.exe
description = Launch My App
wkdir = INSTALLFOLDER
icon = bin\app.ico

[registry:Version]
root = HKLM
key = Software\MyCompany\MyApp
name = Version
value = [ProductVersion]
type = string

[registry:Enabled]
root = HKCU
key = Software\MyCompany\MyApp
name = Enabled
value = 1
type = integer

[service:MyService]
name = MyService
displayname = My Service
image = bin\app.exe
start = demand
type = own
error = normal
description = Installed by msitool

[environment:PATH]
name = PATH
value = [INSTALLFOLDER]bin
action = append
separator = ;
system = no
